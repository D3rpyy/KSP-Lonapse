// Lonapse in-game API test (tests/ingame). Not part of Lonapse, never shipped. Needs Module Manager and, for the
// drill rig, Breaking Ground. Removed again with tests/ingame/install.sh --remove.

// a made-up experiment that runs through the KSP science system: Lonapse sees it like a stock one
EXPERIMENT_DEFINITION
{
	id = exampleSoil
	title = Soil Analysis (ExampleMod test)
	baseValue = 5
	scienceCap = 10
	dataScale = 1
	requireAtmosphere = False
	situationMask = 63
	biomeMask = 63
	RESULTS
	{
		default = Mostly dirt. The Lonapse test works.
	}
}

// a thermometer that runs exampleSoil
+PART[sensorThermometer]
{
	@name = exampleSoilProbe
	@title = Example Soil Probe (Lonapse test)
	@description = A thermometer that thinks it is a soil probe. Only for the Lonapse API test.
	@MODULE[ModuleScienceExperiment]
	{
		@experimentID = exampleSoil
		@experimentActionName = Analyse Soil
	}
}

// a Breaking Ground seismometer with a part name of its own
+PART[DeployedSeismicSensor]
{
	@name = exampleDrillRig
	@title = Example Drill Rig (Lonapse test)
	@description = A seismometer with a new name. Only for the Lonapse API test.
}

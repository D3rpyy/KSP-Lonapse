name: Release workflow

# Packs the committed GameData/Lonapse into Lonapse-<version>.zip and attaches it to the release.
# The DLL, sounds and phrase table are built locally with ./package.sh and committed. This workflow builds nothing,
# it only checks that the committed files belong to the release version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package and upload (for example v0.6.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and publish Lonapse
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check versions
        run: |
          TAG_VERSION="${TAG#v}"
          SRC_VERSION="$(sed -n 's/.*const string Version = "\([0-9.]*\)".*/\1/p' src/LonapseAddon.cs)"
          AVC_VERSION="$(python3 -c 'import json,sys;v=json.load(open(sys.argv[1]))["VERSION"];print("%d.%d.%d"%(v["MAJOR"],v["MINOR"],v["PATCH"]))' GameData/Lonapse/Lonapse.version)"
          # the Version constant is stored in the DLL as a UTF-16 string, so a DLL built from older source shows here
          DLL_VERSION="$(strings -e l GameData/Lonapse/Plugins/Lonapse.dll | grep -xE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"

          echo "Tag:            $TAG_VERSION"
          echo "Source:         $SRC_VERSION"
          echo "Lonapse.version $AVC_VERSION"
          echo "DLL:            $DLL_VERSION"

          if [ -z "$TAG_VERSION" ] || [ "$SRC_VERSION" != "$TAG_VERSION" ] || [ "$AVC_VERSION" != "$TAG_VERSION" ] || [ "$DLL_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch. Run ./package.sh locally and commit GameData/Lonapse."
            exit 1
          fi
          grep -q "^## $TAG_VERSION" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $TAG_VERSION"; exit 1; }

          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Check that GameData is up to date
        run: |
          # package.sh copies these into GameData/Lonapse. A difference means it was not run before the commit.
          fail=0
          for pair in "README.md:README.md" "CHANGELOG.md:CHANGELOG.md" "LICENSE:LICENSE.txt" "audio/CREDITS.md:CREDITS.md"; do
            src="${pair%%:*}"; dst="GameData/Lonapse/${pair##*:}"
            if ! cmp -s "$src" "$dst"; then
              echo "::error::$dst differs from $src. Run ./package.sh locally and commit GameData/Lonapse."
              fail=1
            fi
          done
          exit $fail

      - name: Pack ZIP
        run: |
          mkdir -p dist
          ZIP="dist/Lonapse-$VERSION.zip"
          zip -qr -X "$ZIP" GameData/Lonapse -x 'GameData/Lonapse/PluginData/*'
          n=$(unzip -l "$ZIP" | grep -cE '\.(wav|ogg)$')
          echo "Packed $ZIP ($(stat -c %s "$ZIP") bytes, $n sound files)"
          unzip -l "$ZIP" | grep -q 'GameData/Lonapse/Plugins/Lonapse.dll' || { echo "::error::Lonapse.dll is missing from the ZIP"; exit 1; }

      - name: Upload release ZIP
        run: gh release upload "$TAG" "dist/Lonapse-$VERSION.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

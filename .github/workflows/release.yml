name: Release workflow

# Packs the committed GameData/Lonapse plus the runtime voice into Lonapse-<version>.zip and attaches it to the
# release. That is the only file on a version release, so CKAN always takes the right zip.
# Lonapse-<version>-runtime-source.zip (the GPL source of espeak-ng and Piper) goes to the separate prerelease
# runtime-source, made here when it is missing. CKAN skips prereleases, and this workflow does not run for one.
# The DLL, sounds and phrase table are built locally with ./package.sh and committed. The workflow checks that they
# belong to the release version. The runtime voice is not in git: fetch_runtime.sh downloads Piper and the original
# voices, makes the int8 voices and checks every file against the pinned sha256, so the zip holds the tested files.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package and upload (for example v0.6.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and publish Lonapse
    runs-on: ubuntu-24.04
    # not for a prerelease (the runtime-source release, or a test): only a version release is packaged
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check versions
        run: |
          TAG_VERSION="${TAG#v}"
          SRC_VERSION="$(sed -n 's/.*const string Version = "\([0-9.]*\)".*/\1/p' src/LonapseAddon.cs)"
          AVC_VERSION="$(python3 -c 'import json,sys;v=json.load(open(sys.argv[1]))["VERSION"];print("%d.%d.%d"%(v["MAJOR"],v["MINOR"],v["PATCH"]))' GameData/Lonapse/Lonapse.version)"
          # the Version constant is stored in the DLL as a UTF-16 string, so a DLL built from older source shows here
          DLL_VERSION="$(strings -e l GameData/Lonapse/Plugins/Lonapse.dll | grep -xE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"

          echo "Tag:            $TAG_VERSION"
          echo "Source:         $SRC_VERSION"
          echo "Lonapse.version $AVC_VERSION"
          echo "DLL:            $DLL_VERSION"

          if [ -z "$TAG_VERSION" ] || [ "$SRC_VERSION" != "$TAG_VERSION" ] || [ "$AVC_VERSION" != "$TAG_VERSION" ] || [ "$DLL_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch. Run ./package.sh locally and commit GameData/Lonapse."
            exit 1
          fi
          grep -q "^## $TAG_VERSION" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $TAG_VERSION"; exit 1; }

          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Check that GameData is up to date
        run: |
          # package.sh copies these into GameData/Lonapse. A difference means it was not run before the commit.
          fail=0
          for pair in "README.md:README.md" "CHANGELOG.md:CHANGELOG.md" "LICENSE:LICENSE.txt" "LICENSE-CC-BY-4.0:LICENSE-CC-BY-4.0.txt" "docs/LICENSING.md:LICENSING.md" "audio/CREDITS.md:CREDITS.md"; do
            src="${pair%%:*}"; dst="GameData/Lonapse/${pair##*:}"
            if ! cmp -s "$src" "$dst"; then
              echo "::error::$dst differs from $src. Run ./package.sh locally and commit GameData/Lonapse."
              fail=1
            fi
          done
          exit $fail

      - name: Set up Python for the runtime voices
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Fetch and check the runtime voice
        run: |
          python -m pip install --quiet -r runtime/requirements.txt
          ./fetch_runtime.sh --python "$(command -v python)"

      - name: Pack ZIP
        run: ./pack_zip.sh "$VERSION"

      - name: Upload the release ZIP
        run: gh release upload "$TAG" "dist/Lonapse-$VERSION.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload the runtime source to the runtime-source prerelease
        run: |
          SRC="audio/build/runtime_source/Lonapse-$VERSION-runtime-source.zip"
          [ -f "$SRC" ] || { echo "::error::$SRC is missing"; exit 1; }
          if ! gh release view runtime-source >/dev/null 2>&1; then
            gh release create runtime-source --prerelease --target "$(git rev-parse HEAD)" \
              --title "Runtime voice source (GPL)" \
              --notes "The source code of Piper, piper-phonemize and espeak-ng for the runtime voice that ships in Lonapse, one zip per Lonapse version. This is not a Lonapse release: download Lonapse from the version releases."
          fi
          gh release upload runtime-source "$SRC" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

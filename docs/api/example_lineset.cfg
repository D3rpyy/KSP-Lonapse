// Example of your own probe lineset, for the Lonapse README ("Your own lines for a probe").
// Put this in GameData/YourMod/. Registration nodes need no MM. the @PART patch below requires MM.
// Replace myProbeCore with your part name. it must have ModuleCommand with minimumCrew = 0.
// See docs/ModuleLonapse.md for editing an existing module and voice-selection precedence.
// Copy example_lineset.tsv to GameData/YourMod/Lonapse/Probe/lineset.tsv.
// Optional contextual dialogue: example_probe_lineset.tsv -> GameData/YourMod/Lonapse/Probe/power.tsv.

// 1. Register the lineset. name: a to z, 0 to 9 and _ (at most 32), not "any" and not a stock core.
//    It is the value of the core column in your table.
LONAPSE_PROBE_LINES
{
    name = pip
    displayName = Pip       // optional label for the lineset in the settings
}

// 2. Give a voice these lines. This voice sounds like nothing stock, so it has its own beeps (see the README).
LONAPSE_PROBE_VOICE
{
    name = pipvoice
    displayName = Pip
    lines = pip
    baseHz = 900
    wave = triangle
    rhythm = swing
}

// 3. Give a part the voice. Or only the lines, with lines = pip on the module: the voice then stays the stock one.
//    ModuleLonapse can sit in the part's own config, or come with a Module Manager patch like this one.
@PART[myProbeCore]:HAS[!MODULE[ModuleLonapse]]:NEEDS[Lonapse]:AFTER[Lonapse]
{
    MODULE
    {
        name = ModuleLonapse
        voice = pipvoice
        lines = pip         // optional, wins over the voice lines unless the player picked a voice
        priority = 0
        displayName = Pip
    }
}

// Lonapse: the stock probe cores get ModuleLonapse with their own voice, like any modded core.
// Module Manager is optional. Without it these patches do nothing, and Lonapse gives the stock cores the same voices
// from its own list of stock part names (ProbeCores in the source).
// :HAS[!MODULE[ModuleLonapse]] leaves a core alone that another mod already gave a voice.
// :FOR[Lonapse] so a patch of your own can run :AFTER[Lonapse] to change a voice or a priority.
// priority -1: a modded core with ModuleLonapse (priority 0 or more) still wins over a stock core on the same vessel.

@PART[probeCoreSphere|probeCoreSphere_v2]:HAS[!MODULE[ModuleLonapse]]:FOR[Lonapse]
{
    MODULE { name = ModuleLonapse  voice = stayputnik  priority = -1 }
}
@PART[probeCoreCube]:HAS[!MODULE[ModuleLonapse]]:FOR[Lonapse]
{
    MODULE { name = ModuleLonapse  voice = qbe  priority = -1 }
}
@PART[probeCoreOcto|probeCoreOcto_v2|probeCoreOcto2|probeCoreOcto2_v2]:HAS[!MODULE[ModuleLonapse]]:FOR[Lonapse]
{
    MODULE { name = ModuleLonapse  voice = okto  priority = -1 }
}
@PART[probeCoreHex|probeCoreHex_v2|HECS2_ProbeCore]:HAS[!MODULE[ModuleLonapse]]:FOR[Lonapse]
{
    MODULE { name = ModuleLonapse  voice = hecs  priority = -1 }
}
@PART[roverBody|roverBody_v2]:HAS[!MODULE[ModuleLonapse]]:FOR[Lonapse]
{
    MODULE { name = ModuleLonapse  voice = rovemate  priority = -1 }
}
@PART[probeStackSmall|probeStackLarge]:HAS[!MODULE[ModuleLonapse]]:FOR[Lonapse]
{
    MODULE { name = ModuleLonapse  voice = snob  priority = -1 }
}
@PART[mk2DroneCore]:HAS[!MODULE[ModuleLonapse]]:FOR[Lonapse]
{
    MODULE { name = ModuleLonapse  voice = mk2drone  priority = -1 }
}
@PART[MpoProbe]:HAS[!MODULE[ModuleLonapse]]:FOR[Lonapse]
{
    MODULE { name = ModuleLonapse  voice = mpo  priority = -1 }
}
@PART[MtmStage]:HAS[!MODULE[ModuleLonapse]]:FOR[Lonapse]
{
    MODULE { name = ModuleLonapse  voice = mtm  priority = -1 }
}

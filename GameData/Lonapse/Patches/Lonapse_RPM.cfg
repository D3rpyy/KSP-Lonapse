// Lonapse: a Comms page with the subtitles on RasterPropMonitor screens.
// Only with RasterPropMonitor and Module Manager installed. Without them this file does nothing.
// RPM finds RpmCommsPage in Lonapse.dll by name. Lonapse has no reference to RPM.
// Each page is added next to the pages a button already has, so press that button again to reach it.
// No other button changes. On the Comms page ENTER (button 2 of globalButtons) starts or stops the countdown,
// UP and DOWN (buttons 0 and 1) scroll the log.
// :FOR[Lonapse] so a patch of your own can run :AFTER[Lonapse] to move the page or add it to another monitor.

// Stock RPM MFD (the RPM versions of the stock pods): button R5, after Crew and Flight Log.
@PROP[RasterPropMonitorBasicMFD]:NEEDS[RasterPropMonitor]:FOR[Lonapse]
{
    @MODULE[RasterPropMonitor]
    {
        PAGE
        {
            name = lonapseComms
            button = buttonR5
            PAGEHANDLER
            {
                name = RpmCommsPage
                method = ShowComms
                getHandlerReferencesMethod = HandlerReferences
                buttonClickMethod = ButtonProcessor
                pageActiveMethod = PageActive
                countdownButton = 2
                scrollUpButton = 0
                scrollDownButton = 1
            }
            textureURL = JSI/RasterPropMonitor/Library/Textures/bg01
            BACKGROUNDHANDLER
            {
                name = RpmUnicodeOverlay
                method = RenderUnicode
            }
        }
    }
}

// ASET ALCOR MFD 40x20 (ASET IVAs, DE_IVAExtension): button R6, which the screen labels SCI/COMM,
// after Science and IRC. The IRC overlay shows COMM as the active button. The overlay takes the top
// and bottom row, so the page uses rows 1 to 18, like the Flight Log and Science pages of this screen.
@PROP[ALCORMFD40x20]:NEEDS[RasterPropMonitor]:FOR[Lonapse]
{
    @MODULE[RasterPropMonitor]
    {
        PAGE
        {
            name = lonapseComms
            button = buttonR6
            textureURL = ASET/ASET_Props/MFDs/ALCORMFD40x20/bg01
            textOverlay = ASET/ASET_Props/MFDs/ALCORMFD40x20/ALCORIRC40x20.txt
            PAGEHANDLER
            {
                name = RpmCommsPage
                method = ShowComms
                getHandlerReferencesMethod = HandlerReferences
                buttonClickMethod = ButtonProcessor
                pageActiveMethod = PageActive
                countdownButton = 2
                scrollUpButton = 0
                scrollDownButton = 1
                pageTitle = ================ Comms =================
                topRows = 1
                screenWidth = 40
                screenHeight = 18
            }
            BACKGROUNDHANDLER
            {
                name = RpmUnicodeOverlay
                method = RenderUnicode
                backgroundTextureURL = ASET/ASET_Props/MFDs/ALCORMFD40x20/bg01
            }
        }
    }
}

// ASET ALCOR MFD 60x30: button R5 (SCI / COMM), after Science and IRC. Rows 1 to 28, like its Science page.
@PROP[ALCORMFD60x30]:NEEDS[RasterPropMonitor]:FOR[Lonapse]
{
    @MODULE[RasterPropMonitor]
    {
        PAGE
        {
            name = lonapseComms
            button = buttonR5
            textureURL = ASET/ASET_Props/MFDs/ALCORMFD60x30/BG62x30
            textOverlay = ASET/ASET_Props/MFDs/ALCORMFD60x30/ALCORIRC60x30.txt
            PAGEHANDLER
            {
                name = RpmCommsPage
                method = ShowComms
                getHandlerReferencesMethod = HandlerReferences
                buttonClickMethod = ButtonProcessor
                pageActiveMethod = PageActive
                countdownButton = 2
                scrollUpButton = 0
                scrollDownButton = 1
                pageTitle = ============================ Comms =============================
                topRows = 1
                screenWidth = 60
                screenHeight = 28
            }
            BACKGROUNDHANDLER
            {
                name = RpmUnicodeOverlay
                method = RenderUnicode
                backgroundTextureURL = ASET/ASET_Props/MFDs/ALCORMFD60x30/BG62x30
            }
        }
    }
}
